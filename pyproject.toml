[project]
name = "speckle-fme-core"
version = "0.1.0"
description = "Core module for the Speckle FME connector (Speckle Next)"
requires-python = ">=3.10"
dependencies = [
    "specklepy[bundle]>=3.0.0",
    "pyarrow>=17.0.0",
    "duckdb>=1.1.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["speckle_fme_core"]
